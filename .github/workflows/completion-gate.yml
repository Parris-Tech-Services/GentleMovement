name: Project Completion Gate
# Automatic runs paused to cap GitHub Actions costs; use Run workflow when needed.
on:
  workflow_dispatch:
jobs:
  completion:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate autonomous runner syntax
        run: python3 -m py_compile scripts/autonomous-repair.py
      - name: Self-test repair runner credential isolation
        run: python3 scripts/autonomous-repair.test.py
      - name: Self-test completion enforcement
        run: node --test scripts/completion-gate.test.mjs
      - name: Validate ledger and publish honest progress report
        run: node scripts/completion-gate.mjs
      - name: Enforce completion only when explicitly requested
        if: ${{ contains(github.event.pull_request.labels.*.name, 'ready-for-completion') }}
        run: node scripts/completion-gate.mjs --strict
      - name: Escalate unfinished objectives on scheduled checks
        if: github.event_name == 'schedule'
        run: node scripts/completion-gate.mjs --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-completion-report
          path: completion/report.md
